name: Projet-10
on:
  push 
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: récuéprer le code
        uses: actions/checkout@v4

      - name: installer python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: lancer les dépendances
        run: |
          python -m pip install --upgrade pip
          pithon -m pip install -r requirements.txt
      
      - name: Vérifier Pytest
        run: python -m pytest --version
      
      - name: lancer les tests
        run: pythest -v
